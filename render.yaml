# Render Blueprint: New → Blueprint → pick this repository. Fill the secret values Render asks for
# (see docs/HOSTING.md). The site needs a server that stays on, because reading and marking run in the background.
# Free plan for trying it out: sleeps after 15 idle minutes (first visit then waits about a minute) and has 512 MB memory.
# To go live, change `plan: free` to `plan: starter` (about US$7/month); nothing else needs to change.
services:
  - type: web
    name: sheetloop
    runtime: node
    plan: free
    region: singapore
    # Migrations run in the build because the free plan has no pre-deploy step. A failed migration fails the deploy.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm db:migrate && pnpm --filter @exam/web build
    # Smaller JS heap only at run time; the build keeps the default so it is not starved.
    startCommand: NODE_OPTIONS=--max-old-space-size=384 pnpm --filter @exam/web start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Encrypts saved API keys. Use the same value as the local .env (they share one database). Never change it afterwards.
      - key: SETTINGS_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: STORAGE_QUOTA_MB
        value: "1024"
      # Keep memory under the free plan's 512 MB: one image-processing thread, less malloc fragmentation.
      - key: VIPS_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
