:root {
  --bg:#F2F0EB;
  --ink:#1C1C21;
  --muted:#6E6C73;
  --faint:#A19E98;
  --line:#E8E4DD;
  --card:#FFFFFF;
  --win:#FCFBF9;
  --blue:#2F5BE0;
  --blue-soft:#EEF2FF;
  --blue-line:#C9D6FF;
  --green:#1F9D6B;
  --green-soft:#E5F5EE;
  --red:#D8333A;
  --amber:#C77A12;
  --amber-soft:#FFF3DF;
  --sans:"Inter Variable","Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}

/* src/theme/base.css */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  background: #111;
  overflow: hidden;
  height: 100%;
}
body {
  font-family: var(--sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings:
    "cv11",
    "ss01",
    "tnum";
}
#stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: var(--bg);
  transform-origin: 0 0;
}
.abs {
  position: absolute;
  left: 0;
  top: 0;
}
.hide {
  visibility: hidden;
}

/* src/theme/brand.css */
.logo {
  width: 150px;
  height: 150px;
  border-radius: 40px;
  box-shadow: 0 30px 60px -18px rgba(61, 80, 245, .5), 0 8px 18px -8px rgba(40, 30, 120, .3);
  transform-origin: 0 0;
}
.logo svg {
  display: block;
}
.wordmark {
  font-size: 96px;
  font-weight: 800;
  letter-spacing: -.025em;
  display: flex;
  justify-content: center;
  width: 1920px;
}
.wordmark .clip {
  overflow: hidden;
  padding: 0 2px 10px;
}
.wordmark .ch {
  display: inline-block;
}
.tagline {
  width: 1920px;
  text-align: center;
  font-size: 30px;
  color: var(--muted);
  letter-spacing: .06em;
}
.tagline .local {
  color: #4F55F2;
  font-weight: 700;
  margin-right: .7em;
}

/* src/theme/ui.css */
.pill {
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--muted);
  background: #fff;
}
.chip {
  height: 36px;
  padding: 0 16px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
}
.chip.dark {
  background: var(--ink);
  color: #fff;
}
.chip.blue {
  background: var(--blue-soft);
  color: var(--blue);
}
.chead {
  display: flex;
  align-items: center;
  gap: 10px;
}
.badge {
  height: 26px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  font-weight: 500;
}
.badge.amber {
  background: var(--amber-soft);
  border-color: #F4D8A8;
  color: var(--amber);
}
.badge.blue {
  background: var(--blue-soft);
  border-color: var(--blue-line);
  color: var(--blue);
}
.badge.green {
  background: var(--green-soft);
  border-color: #BFE6D3;
  color: var(--green);
}
.stem {
  font-size: 18px;
  margin-top: 10px;
}
.og {
  height: 38px;
  border-radius: 10px;
  background: #F6F4F0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 15px;
  gap: 10px;
}
.og b {
  color: var(--muted);
  font-weight: 600;
}
.og.ok {
  background: var(--green-soft);
  color: #11633F;
}
.og.ok b {
  color: var(--green);
}

/* src/core/player.css */
#ui {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: rgba(17, 17, 17, .9);
  color: #ddd;
  font: 13px/1 var(--mono);
  z-index: 10;
}
#ui input {
  flex: 1;
}
#ui button {
  background: #333;
  color: #eee;
  border: 0;
  border-radius: 6px;
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
}
.render #ui {
  display: none;
}

/* src/components/background/style.css */
#bg {
  position: absolute;
  inset: 0;
}
#grid {
  position: absolute;
  inset: -64px;
  background-image:
    radial-gradient(
      circle,
      #D8D3C9 1.1px,
      transparent 1.6px);
  background-size: 32px 32px;
  opacity: .55;
}
#vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      1400px 900px at 50% 45%,
      transparent 55%,
      rgba(60, 50, 30, .10));
}

/* src/components/intro/style.css */

/* src/components/app-window/style.css */
#win {
  left: 160px;
  top: 90px;
  width: 1600px;
  height: 900px;
  border-radius: 28px;
  background: var(--win);
  box-shadow:
    0 60px 120px -40px rgba(40, 30, 10, .28),
    0 18px 40px -20px rgba(40, 30, 10, .18),
    0 0 0 1px rgba(0, 0, 0, .05);
  overflow: hidden;
}
#hdr {
  position: absolute;
  left: 0;
  top: 0;
  width: 1600px;
  height: 72px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .6);
}
#slot {
  position: absolute;
  left: 32px;
  top: 18px;
  width: 36px;
  height: 36px;
}
#slot svg {
  display: block;
}
#hdrWord {
  position: absolute;
  left: 82px;
  top: 22px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.02em;
  white-space: nowrap;
}
#hdrWord small {
  font-size: 14px;
  font-weight: 600;
  color: var(--faint);
  letter-spacing: .12em;
  margin-left: 9px;
}
#nav {

  left: 266px;
  top: 25px;
  display: flex;
  gap: 36px;
  font-size: 16px;
  color: var(--muted);
}

  color: var(--ink);

}
#navBar {
  position: absolute;
  left: 266px;
  top: 69px;
  height: 3px;
  width: 64px;
  border-radius: 3px;
  background: var(--blue);
}
#hdrRight {
  position: absolute;
  right: 28px;
  top: 18px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background:
    linear-gradient(
      135deg,
      #FFB38A,
      #FF7E7E);
}
.h-title {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: .02em;
}
.h-sub {
  font-size: 18px;
  color: var(--muted);
}
#drop {
  left: 64px;
  top: 224px;
  width: 920px;
  height: 610px;
  border-radius: 24px;
  border: 2px dashed #D6D1C8;
  background: #F7F5F1;
}
#dropInner {
  position: absolute;
  left: 0;
  top: 210px;
  width: 916px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.icoCircle {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px -12px rgba(40, 30, 10, .25);
}
#dropCount {
  position: absolute;
  left: 0;
  top: 548px;
  width: 916px;
  display: flex;
  justify-content: center;
}
#panel {
  left: 1024px;
  top: 224px;
  width: 512px;
  height: 610px;
  border-radius: 24px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 20px 50px -30px rgba(40, 30, 10, .25);
}
.lbl {
  position: absolute;
  left: 32px;
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
}
.mrow {
  position: absolute;
  left: 32px;
  width: 448px;
  height: 72px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
}
.mdot {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
}
.mname {
  font-size: 18px;
  font-weight: 600;
}
.mdesc {
  font-size: 14px;
  color: var(--muted);
  margin-top: 2px;
}
.radio {
  margin-left: auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #D0CCC4;
  position: relative;
}
.radio i {
  position: absolute;
  left: 3px;
  top: 3px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--blue);
}
#mSel {
  position: absolute;
  left: 32px;
  width: 448px;
  height: 72px;
  border-radius: 16px;
  border: 2px solid var(--blue);
  background: var(--blue-soft);
}
#sel {
  position: absolute;
  left: 32px;
  top: 370px;
  width: 448px;
  height: 56px;
  border-radius: 14px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-size: 17px;
  gap: 10px;
}
#btn {
  position: absolute;
  left: 32px;
  top: 514px;
  width: 448px;
  height: 64px;
  border-radius: 16px;
  background: var(--blue);
  color: #fff;
  font-size: 19px;
  font-weight: 600;
  overflow: hidden;
  box-shadow: 0 14px 30px -12px rgba(47, 91, 224, .6);
}
#btnFill {
  position: absolute;
  left: 0;
  top: 0;
  height: 64px;
  width: 448px;
  background:
    linear-gradient(
      90deg,
      #4C74F0,
      #7E9BFF);
  transform-origin: 0 0;
}
.btnTxt {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

/* src/components/exam-paper/style.css */
.paper {
  width: 566px;
  height: 800px;
  background: #FFFEFB;
  border-radius: 6px;
  box-shadow: 0 30px 60px -24px rgba(40, 30, 10, .35), 0 2px 6px rgba(40, 30, 10, .08);
  overflow: hidden;
}
.paper .fchip {
  position: absolute;
  left: 30px;
  bottom: 30px;
  height: 64px;
  padding: 0 26px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 30px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 12px;
}

<body>
<div id="stage">
  <div id="app" class="abs" style="width:1920px;height:1080px;transform-origin:960px 540px"></div>
</div>
<div id="ui"><button id="play">❚❚</button><input id="scrub" type="range" min="0" max="20" step="0.001" value="0"><span id="tc">0.000s</span></div>
<script>(() => {
  // src/core/math.js
  var clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  var lerp = (a, b, p) => a + (b - a) * p;
  var prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = (s) => ((ax * s + bx) * s + cx) * s, dX = (s) => (3 * ax * s + 2 * bx) * s + cx;
    const Y = (s) => ((ay * s + by) * s + cy) * s;
    return (p) => {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      let s = p;
      for (let i = 0; i < 8; i++) {
        const d = dX(s);
        if (Math.abs(d) < 1e-6) break;
        s -= (X(s) - p) / d;
      }
      s = clamp(s);
      let lo = 0, hi = 1;
      for (let i = 0; i < 20 && Math.abs(X(s) - p) > 1e-6; i++) {
        if (X(s) < p) lo = s;
        else hi = s;
        s = (lo + hi) / 2;
      }
      return Y(s);
    };
  }
  var E = {
    out: bezier(0.16, 1, 0.3, 1),
    // expo-like decel
    inOut: bezier(0.65, 0, 0.35, 1),
    soft: bezier(0.4, 0, 0.2, 1),
    in: bezier(0.55, 0, 0.9, 0.45),
    sine: (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p))
  };
  function spring(dt, f = 1.8, z = 0.6) {
    if (dt <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + z * w / wd * Math.sin(wd * dt));

  // src/core/player.js
  function boot({ seek: seek2, duration }) {
    const params = new URLSearchParams(location.search);
    const render = params.has("render");
    const stage = document.getElementById("stage");
    if (render) document.documentElement.classList.add("render");
    window.DURATION = duration;
    window.seek = seek2;
    window.ready = document.fonts.ready.then(() => {
      seek2(+params.get("t") || 0);
      return true;

    const fit = () => {
      const k = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080);
      stage.style.transform = `scale(${k})`;

      stage.style.top = (innerHeight - 56 - 1080 * k) / 2 + "px";

    let playing = true, t0 = performance.now(), base = +params.get("t") || 0, cur = base;

      base = cur;
      t0 = performance.now();

      tc.textContent = cur.toFixed(3) + "s";

      playing = !playing;
      btn.textContent = playing ? "❚❚" : "▶";
      base = cur;
      t0 = performance.now();
    };
    addEventListener("keydown", (e) => {

    });
    (function loop2(now) {
      if (playing) {
        cur = (base + (now - t0) / 1e3) % duration;

        scrub.value = cur;
        tc.textContent = cur.toFixed(3) + "s";
      }
      requestAnimationFrame(loop2);

  }

  // src/shared/timeline.js
  var DURATION = 20;
  var CUE = {
    logoIn: 0.2,
    // logo tile springs in
    logoFly: [2.3, 3.2],
    // logo flies into the window header
    winIn: [2.45, 3.35],
    // app window rises in
    clickModel: 4.3,
    // cursor picks Claude
    clickStart: [5.1, 5.35],
    // cursor presses 開始辨識 (press window)
    uploadOut: [5.95, 6.4],
    // upload UI fades, paper becomes the page
    pageMorph: [5.95, 6.9],
    beam: [6.85, 8.55],
    // scan beam sweeps the page
    resultsOut: 10,
    // result cards leave
    zoom: [10.1, 11.1],
    // camera pushes into the figure
    sweep: [11.3, 12.15],
    // handwriting eraser sweep
    appOut: [13.45, 14.25],
    // whole app layer leaves for the phone
    mobileOut: [17.45, 17.95],
    outroLogo: 17.75,
    outroFade: [19.35, 19.95]
    // everything fades back to the empty background (loop point)
  };
  function winMotion(t) {
    const p = ease(t, ...CUE.winIn);
    return { p, s: lerp(0.9, 1, p), y: lerp(140, 0, p) };

  // src/core/dom.js
  var $ = (id) => document.getElementById(id);

      r2.score.textContent = Math.round(92 * ring);
      stats.forEach((el2, i) => {
        const p = ease(t, 16.7 + i * 0.09, 17.4 + i * 0.09);
        put(el2.querySelector("i"), { sx: Math.max(STATS[i] * p, 1e-4) });
        put(el2, { y: lerp(14, 0, p), o: clamp(p * 2) });
      });
    }
  };

  // src/components/outro/view.html
  var view_default9 = '  <div id="outro" class="abs">\n    <div id="outWord" class="abs wordmark" style="top:540px;font-size:72px"></div>\n    <div id="steps" class="abs">\n      <svg class="abs" width="1920" height="80"><path id="stepLine" d="M640 32H1280" stroke="#C9C4BA" stroke-width="2" stroke-dasharray="6 8" fill="none"/></svg>\n    </div>\n  </div>\n';

  // src/components/outro/index.js
  var STEPS = [
    ["上傳", "#2F5BE0", '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'],
    ["辨識", "#7B5CF0", '<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/>'],
    ["校對", "#C77A12", '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'],
    ["測驗", "#1F9D6B", '<path d="M5 12.5l4.5 4.5L19 7.5"/>']
  ];
  var STEP_X = [560, 790, 1020, 1250];
  var root;
  var chars2;
  var line;
  var steps;
  var outro_default = {
    id: "outro",
    layer: "stage",
    view: view_default9,
    mount() {
      root = $("outro");
      line = $("stepLine");
      root.style.transformOrigin = "960px 540px";
      chars2 = letters($("outWord"), BRAND.name);
      steps = STEPS.map(([name, col, icon], i) => {
        const d = document.createElement("div");
        d.className = "step abs";
        d.innerHTML = `<span class="si" style="background:${col}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></span>${name}`;
        d.style.left = STEP_X[i] + "px";
        $("steps").appendChild(d);
        return d;
      });
    },
    seek(t) {
      const fade = outroFade(t);
      chars2.forEach((c, i) => {
        const p = ease(t, 17.95 + i * 0.06, 18.7 + i * 0.06);
        put(c, { y: lerp(90, 0, p), o: p * (1 - fade) });
      });
      line.setAttribute("d", `M640 32H${lerp(640, 1320, ease(t, 18.25, 19, E.inOut)).toFixed(1)}`);
      show(line, 1 - fade);
      steps.forEach((el2, i) => {
        const p = spring(t - 18.3 - i * 0.12, 1.9, 0.55);
        put(el2, { y: lerp(26, 0, clamp(p)), s: Math.max(lerp(0.6, 1, p), 1e-4), o: clamp(p * 2.5) * (1 - fade) });
      });
      put(root, { s: 1 - 0.02 * fade });
    }
  };

  // src/components/logo/view.html
  var view_default10 = '  <div id="flyLogo" class="abs logo"></div>\n';

  // src/components/logo/index.js
  var el;
  var loop;
  var logo_default = {
    id: "logo",
    layer: "stage",
    view: view_default10,
    mount() {
      el = $("flyLogo");
      el.innerHTML = markSvg();
      loop = el.querySelector(".loop");
    },
    seek(t) {
      if (t < 10) {
        const win = winMotion(t);
        const ls = spring(t - CUE.logoIn, 1.4, 0.5), lf = ease(t, ...CUE.logoFly, E.inOut);
        const [sx, sy] = winToStage(win, SLOT.x, SLOT.y);
        put(el, {
          x: lerp(LOGO_BIG.x + 75 * (1 - ls), sx, lf),
          y: lerp(LOGO_BIG.y + 75 * (1 - ls), sy, lf),
          s: Math.max(lerp(ls, SLOT.s * win.s, lf), 1e-4),
          r: lerp(-16, 0, clamp(ls)) * (1 - lf),
          o: lf >= 1 ? 0 : clamp(ls * 4)
        });
        spinLoop(loop, lerp(-300, 0, ls) - 360 * lf);
      } else {
        const p = outroLogo(t);
        put(el, { x: 900 + 60 * (1 - p), y: 330 + 60 * (1 - p), s: Math.max(p * 0.8, 1e-4), r: lerp(14, 0, clamp(p)), o: clamp(p * 4) * (1 - outroFade(t)) });
        spinLoop(loop, lerp(-300, 0, p));
      }
    }
  };

  // src/main.js
  var COMPONENTS = [background_default, intro_default, app_layer_default, app_window_default, exam_paper_default, results_default, figure_panel_default, cursor_default, mobile_default, outro_default, logo_default];
  var layers = { stage: document.getElementById("stage"), app: document.getElementById("app") };
  for (const c of COMPONENTS) if (c.view) layers[c.layer].insertAdjacentHTML("beforeend", c.view);
  layers.stage.insertBefore(layers.app, document.getElementById("mobile"));
  for (const c of COMPONENTS) c.mount?.();
  function seek(t) {
    t = clamp(t, 0, DURATION);
    for (const c of COMPONENTS) c.seek(t);
  }
  boot({ seek, duration: DURATION });
})();
</script>
