<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheetloop</title>
<style>
  :root { --paper: #fcfcfa; --grid: #e9edf5; --ink: #1b2340; --muted: #5f6782; --accent: #2F4BFF; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0f1528; --grid: #172039; --ink: #e6eaf7; --muted: #97a0bd; --accent: #7D93FF; --on-accent: #0f1528; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 18px 18px;
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 340px; text-align: center; }
  svg { width: 56px; height: 56px; }
  svg path { fill: var(--accent); } svg circle { stroke: var(--accent); }
  h1 { font-size: 18px; margin: 16px 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); }
  button {
    font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0;
    border-radius: 10px; padding: 9px 18px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><g transform="translate(-2 -1)"><path d="M14 8H38A6 6 0 0 1 44 14V30A20 20 0 0 0 30 50H14A6 6 0 0 1 8 44V14A6 6 0 0 1 14 8Z"/><circle cx="46" cy="47" r="8.5" stroke-width="5"/></g></svg>
  <h1 id="title">目前沒有網路</h1>
  <p id="body">連上網路後再試一次，你的題庫都還在。</p>
  <button id="retry" type="button" onclick="location.reload()">重新整理</button>
</main>
<script>
  // This page cannot reach the app's translations, so it carries its own few lines.
  var TEXT = {
    'zh-Hans': ['目前没有网络', '连上网络后再试一次，你的题库都还在。', '重新加载'],
    en: ['You are offline', 'Reconnect and try again. Your question bank is safe.', 'Reload'],
    ja: ['オフラインです', 'ネットにつながったら、もう一度お試しください。問題集はそのまま残っています。', '再読み込み'],
    ko: ['인터넷에 연결되어 있지 않아요', '연결된 뒤 다시 시도해 주세요. 문제집은 그대로 있어요.', '새로고침'],
    es: ['Sin conexión', 'Vuelve a intentarlo cuando tengas internet. Tu banco de preguntas sigue a salvo.', 'Recargar'],
    fr: ['Hors ligne', 'Réessaie une fois connecté. Ta banque de questions est intacte.', 'Recharger'],
    de: ['Keine Verbindung', 'Versuch es wieder, sobald du online bist. Deine Fragensammlung ist sicher.', 'Neu laden'],
    pt: ['Sem conexão', 'Tente de novo quando estiver on-line. Seu banco de questões está seguro.', 'Recarregar'],
    vi: ['Không có kết nối mạng', 'Hãy thử lại khi có mạng. Ngân hàng câu hỏi của bạn vẫn an toàn.', 'Tải lại'],
    th: ['ไม่มีการเชื่อมต่ออินเทอร์เน็ต', 'ลองอีกครั้งเมื่อเชื่อมต่อได้ คลังข้อสอบของคุณยังอยู่ครบ', 'โหลดใหม่'],
    id: ['Tidak ada koneksi', 'Coba lagi setelah tersambung. Bank soalmu tetap aman.', 'Muat ulang'],
  }
  var saved = (document.cookie.match(/(?:^|; )locale=([^;]+)/) || [])[1]
  var nav = (navigator.language || '').toLowerCase()
  var lang = saved || (/^zh-(cn|sg|my|hans)/.test(nav) ? 'zh-Hans' : nav.slice(0, 2) === 'zh' ? 'zh-Hant' : nav.slice(0, 2))
  var t = TEXT[lang]
  if (t) {
    document.documentElement.lang = lang
    document.getElementById('title').textContent = t[0]
    document.getElementById('body').textContent = t[1]
    document.getElementById('retry').textContent = t[2]
  }
</script>
</body>
</html>
